tags:
  - Contacts
summary: Patch contact by id
operationId: patchContact
description: 'Patch contact by id'
security:
  - bearerAuth: []
parameters:
  - in: path
    name: id
    required: true
    schema:
      type: string
      example: '65ca67e7ae7f10c88b598384'
requestBody:
  description: 'Contact data to update. All fields are optional.'
  required: true
  content:
    multipart/form-data:
      schema:
        type: object
        properties:
          name:
            description: "Contact's new name"
            type: string
            example: 'Jane Doe Updated'
          phoneNumber:
            description: "Contact's new phone number"
            type: string
            example: '+380509876543'
          email:
            description: "Contact's new email"
            type: string
            format: email
            example: 'jane.doe.updated@example.com'
          isFavourite:
            description: "Update contact's favorite status"
            type: boolean
            example: true
          contactType:
            description: "Update contact's type"
            type: string
            enum: ['work', 'home', 'personal']
            example: 'home'
          photo:
            description: 'New photo file for the contact'
            type: string
            format: binary

responses:
  '200':
    description: Successfully patched contact. Returns the updated contact data.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: 'Successfully patched a contact!'
            data:
              $ref: '../../../components/schemas/contact.yaml'
  '401':
    $ref: '../../../components/responses/401.yaml'

  '400':
    $ref: '../../../components/responses/400.yaml'

  '404':
    $ref: '../../../components/responses/404.yaml'
