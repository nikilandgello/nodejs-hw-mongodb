tags:
  - Contacts
summary: Get contacts list
operationId: getContacts
description: Get contacts
security:
  - bearerAuth: []
parameters:
  - in: query
    name: page
    required: false
    schema:
      type: integer
      default: 1
      minimum: 1
      description: The page number to retrieve. Defaults to 1
    example: 1
  - in: query
    name: perPage
    required: false
    schema:
      type: integer
      default: 10
      minimum: 1
    description: The number of contacts to return per page. Defaults to 10
    example: 10
  - in: query
    name: sortBy
    required: false
    schema:
      type: string
      enum: ['_id', 'name']
      default: _id
    description: The field to sort the contacts by. Defaults to _id
    example: name
  - in: query
    name: sortOrder
    required: false
    schema:
      type: string
      enum: [asc, desc]
      default: asc
    description: The order to sort the contacts. Defaults to asc
    example: desc
  - in: query
    name: contactType
    schema:
      type: string
      enum: [work, home, personal]
    description: Filter contacts by their type.
    required: false
    example: personal
  - in: query
    name: isFavourite
    schema:
      type: boolean
    description: Filter contacts by their favorite status (send 'true' or 'false').
    required: false
    example: true
responses:
  '200':
    description: Successfully retrieved contacts.
    content:
      application/json:
        schema:
          type: object
          required:
            - status
            - message
            - data
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contacts!
            data:
              type: object
              required:
                - data
                - page
                - perPage
                - totalItems
                - totalPages
                - hasPreviousPage
                - hasNextPage
              properties:
                data:
                  type: array
                  items:
                    $ref: ../../components/schemas/contact.yaml
                page:
                  type: integer
                  example: 1
                perPage:
                  type: integer
                  example: 10
                totalItems:
                  type: integer
                  example: 4
                totalPages:
                  type: integer
                  example: 1
                hasPreviousPage:
                  type: boolean
                  example: false
                hasNextPage:
                  type: boolean
                  example: true
  '401':
    $ref: ../../components/responses/401.yaml
